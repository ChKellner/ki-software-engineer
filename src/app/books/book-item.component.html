<a
  tabindex="0"
  [routerLink]="['/books', book.id]"
  [attr.aria-label]="'View details for ' + book.title"
  class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-blue-700 transition-shadow duration-300 flex flex-col h-full"
>
  <div class="relative aspect-[3/4] overflow-hidden">
    <app-book-cover
      [src]="book.cover"
      [alt]="book.title"
      imageClass="w-full h-full object-contain bg-gray-100"
      class="block w-full h-full"
    ></app-book-cover>
  </div>
  <div class="p-5 flex flex-col flex-grow">
    <h2 class="text-lg font-semibold text-gray-800 mb-1 line-clamp-2">{{ book.title }}</h2>
    <p *ngIf="book.subtitle" class="text-sm text-gray-600 mb-2 line-clamp-2">{{ book.subtitle }}</p>
    <div class="text-sm text-gray-700 mt-auto">
      <p>
        <span class="text-blue-700">{{ book.author }}</span>
      </p>
      <p *ngIf="book.isbn" class="text-xs text-gray-500 mt-2">ISBN: {{ book.isbn }}</p>
      <p class="text-sm text-blue-700 font-medium mt-4">View details &rarr;</p>
    </div>
  </div>
</a>
