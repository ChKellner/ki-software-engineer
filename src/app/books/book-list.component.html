<div class="container mx-auto px-4 py-12 max-w-7xl">
  <h1 class="text-3xl font-bold mb-10 text-blue-700 border-b pb-4 border-gray-200">Book Collection</h1>

  <a
    routerLink="/book-suggestions"
    class="mb-6 inline-block rounded-md bg-blue-700 px-4 py-2 text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"
  >
    Suggest a book
  </a>

  <div class="mb-6">
    <div class="flex items-center border-b-2 border-gray-300 py-2">
      <input
        type="text"
        aria-label="Search for books"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        placeholder="Search for books..."
        class="appearance-none bg-transparent border-none w-full text-gray-700 mr-3 py-1 px-2 leading-tight focus:outline-none"
      />
      <button
        aria-label="Clear search"
        type="button"
        *ngIf="searchTerm"
        (click)="clearSearch()"
        class="flex-shrink-0 text-gray-500 hover:text-gray-700"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="state.status === 'loading'" role="status" class="flex justify-center items-center py-20">
    <div class="animate-pulse flex flex-col items-center">
      <div
        class="h-16 w-16 rounded-full border-4 border-t-blue-700 border-r-blue-700 border-b-gray-200 border-l-gray-200 animate-spin"
      ></div>
      <p class="mt-4 text-gray-600">Loading books...</p>
    </div>
  </div>

  <div *ngIf="state.status === 'loaded'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-8">
    <app-book-item *ngFor="let book of state.books; trackBy: trackById" [book]="book"></app-book-item>

    <div
      *ngIf="state.books.length === 0"
      class="col-span-full flex flex-col items-center justify-center py-16 text-center bg-gray-50 rounded-xl"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-16 w-16 text-gray-400 mb-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
        />
      </svg>
      <p class="text-xl font-medium text-gray-600 mb-2">
        {{ searchTerm ? 'No books match your search' : 'No books available' }}
      </p>
      <p class="text-gray-500">
        {{ searchTerm ? 'Try different search terms or clear the search' : 'Check back later' }}
      </p>
      <button
        *ngIf="searchTerm"
        (click)="clearSearch()"
        class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200"
      >
        Clear Search
      </button>
    </div>
  </div>
  <section *ngIf="state.status === 'error'" role="alert" class="text-center py-20">
    <h2 class="text-2xl font-semibold">Unable to load books</h2>
    <p class="mt-4">Please try again.</p>
    <button
      type="button"
      (click)="retry()"
      class="mt-4 rounded-md bg-blue-700 px-4 py-2 text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"
    >
      Retry
    </button>
  </section>
</div>
