name: Issue Implementation Preparation

on:
  issues:
    types: [labeled]

jobs:
  prepare-implementation:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-issue-implementation
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.issue-implementation]
          extends = ":workspace"

          [permissions.issue-implementation.network]
          enabled = true

          [permissions.issue-implementation.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Prepare Feature Branch
        id: prepare-branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TITLE_SLUG=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g; s/[^a-z0-9-]//g')
          BRANCH_NAME="feature/${ISSUE_NUMBER}-${TITLE_SLUG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          printf 'branch_name=%s\n' "$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Implement Issue with Codex
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-issue-implementation
          permission-profile: issue-implementation
          prompt: |
            Use the ci-se-green skill. Read and follow
            .codex/skills/skills/ci-se-green/SKILL.md.
            Use the concrete values below instead of the GitHub Actions placeholders in that file.

            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}
            BRANCH: ${{ steps.prepare-branch.outputs.branch_name }}

            You are already on the feature branch. Read the issue and its comments using gh.
            Implement and commit the changes according to the skill.
            Do not run tests, builds, or linters; leave validation to CI.
